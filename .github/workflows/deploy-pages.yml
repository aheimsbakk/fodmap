name: Deploy to GitHub Pages

# Deploys the static app in src/ to GitHub Pages. The site is built
# from src/index.html with relative asset links, so it works under the
# project subpath (https://aheimsbakk.github.io/fodmap/).
#
# Triggers only on push to main — this covers both direct pushes and
# merges (a merge is a push to main). Pull requests, other branches,
# and tags do not trigger a deploy.

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel an in-flight deploy.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          # src/ becomes the site root; index.html must be at its root.
          path: src
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
